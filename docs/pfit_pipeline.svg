<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <style>
      .stage-box { fill: #112240; stroke: #233554; stroke-width: 1.5; rx: 12px; }
      .stage-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .sub-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; fill: #94A3B8; }
      .node-box { fill: #0A192F; stroke: rgba(255, 255, 255, 0.25); stroke-width: 1; rx: 6px; }
      .node-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11.5px; fill: #E2E8F0; text-anchor: middle; }
      .node-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #38BDF8; text-anchor: middle; font-weight: 600; }
      .arrow { stroke: #38BDF8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-sub { stroke: rgba(255, 255, 255, 0.4); stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-gray); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38BDF8" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="rgba(255, 255, 255, 0.4)" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="280" fill="#0A192F" rx="14" stroke="#233554" stroke-width="1.5"/>

  <!-- Stage 1 -->
  <rect x="25" y="20" width="235" height="235" class="stage-box" />
  <text x="40" y="46" class="stage-title">Stage 1: Occipital-Temporal</text>
  <text x="40" y="64" class="sub-title">Visual Sensation &amp; OCR (BA 17-19, 37)</text>
  
  <rect x="42" y="80" width="201" height="38" class="node-box" />
  <text x="142" y="103" class="node-text">Pentacam Scan Image / PDF</text>

  <path d="M 142 118 L 142 135" class="arrow-sub" />

  <rect x="42" y="137" width="201" height="38" class="node-box" />
  <text x="142" y="160" class="node-text">Gemini 2.5 Flash / PyPDF OCR</text>

  <path d="M 142 175 L 142 192" class="arrow-sub" />

  <rect x="42" y="194" width="201" height="42" class="node-box" stroke="#38BDF8" />
  <text x="142" y="212" class="node-badge">Pydantic v2 JSON Schema</text>
  <text x="142" y="228" class="node-text">26 Parameters (Kmax, Thin, Elev)</text>

  <!-- Arrow S1 -> S2 -->
  <path d="M 260 140 L 295 140" class="arrow" />

  <!-- Stage 2 -->
  <rect x="295" y="20" width="235" height="235" class="stage-box" />
  <text x="310" y="46" class="stage-title">Stage 2: Parietal Cortex</text>
  <text x="310" y="64" class="sub-title">Spatial Integration &amp; Rules (BA 7, 39, 40)</text>

  <rect x="312" y="80" width="201" height="38" class="node-box" />
  <text x="412" y="103" class="node-text">Deterministic Guardrails Engine</text>

  <path d="M 412 118 L 412 135" class="arrow-sub" />

  <rect x="312" y="137" width="201" height="38" class="node-box" />
  <text x="412" y="160" class="node-text">Spatial Coupling (Apex vs Thin)</text>

  <path d="M 412 175 L 412 192" class="arrow-sub" />

  <rect x="312" y="194" width="201" height="42" class="node-box" stroke="#38BDF8" />
  <text x="412" y="212" class="node-badge">Empirical Consensus Cutoffs</text>
  <text x="412" y="228" class="node-text">Global Consensus Guardrails</text>

  <!-- Arrow S2 -> S3 -->
  <path d="M 530 140 L 565 140" class="arrow" />

  <!-- Stage 3 -->
  <rect x="565" y="20" width="235" height="235" class="stage-box" />
  <text x="580" y="46" class="stage-title">Stage 3: Frontal / Prefrontal</text>
  <text x="580" y="64" class="sub-title">Analogies &amp; Scaffolding (BA 9-10, 45-46)</text>

  <rect x="582" y="80" width="201" height="38" class="node-box" />
  <text x="682" y="103" class="node-text">Cognitive Scaffolding Engine</text>

  <path d="M 682 118 L 682 135" class="arrow-sub" />

  <rect x="582" y="137" width="201" height="38" class="node-box" />
  <text x="682" y="160" class="node-text">3 Everyday Physical Metaphors</text>

  <path d="M 682 175 L 682 192" class="arrow-sub" />

  <rect x="582" y="194" width="201" height="42" class="node-box" stroke="#38BDF8" />
  <text x="682" y="212" class="node-badge">Optical Impact Translation</text>
  <text x="682" y="228" class="node-text">Watch Glass, Paper, Contours</text>

  <!-- Arrow S3 -> S4 -->
  <path d="M 800 140 L 835 140" class="arrow" />

  <!-- Stage 4 -->
  <rect x="835" y="20" width="240" height="235" class="stage-box" />
  <text x="850" y="46" class="stage-title">Stage 4: Anterior Cingulate</text>
  <text x="850" y="64" class="sub-title">Cognitive Control &amp; Safety (BA 24, 32)</text>

  <rect x="852" y="80" width="206" height="38" class="node-box" />
  <text x="955" y="103" class="node-text">Inhibitory Diagnostic Gating</text>

  <path d="M 955 118 L 955 135" class="arrow-sub" />

  <rect x="852" y="137" width="206" height="38" class="node-box" />
  <text x="955" y="160" class="node-text">Factual Alignment Check (100%)</text>

  <path d="M 955 175 L 955 192" class="arrow-sub" />

  <rect x="852" y="194" width="206" height="42" class="node-box" stroke="#10B981" />
  <text x="955" y="212" class="node-badge" fill="#10B981">Final Calibrated Patient Guide</text>
  <text x="955" y="228" class="node-text">Doctor Questions &amp; 3D/2D Visuals</text>
</svg>
