[project]
name = "course-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "H Sughosh", email = "hegdesughosh7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.28.0",
    "pillow>=12.3.0",
    "plotly>=7.1.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[project.scripts]
course-project = "course_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
include = [".", "src", "tests"]
extraPaths = [".", "src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
reportMissingImports = "none"
reportMissingModuleSource = "none"

